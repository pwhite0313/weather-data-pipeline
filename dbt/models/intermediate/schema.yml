version: 2

models:
  - name: int_weather_enriched
    description: >
      Intermediate model that enriches staging forecast data with derived
      categorical columns. Adds temp_category, wind_category, and precip_type
      based on threshold logic. Consumed by mart models.

    columns:
      - name: city_id
        description: "Unique city identifier."
        tests:
          - not_null

      - name: local_dt
        description: "Forecast timestamp."
        tests:
          - not_null

      - name: temp_category
        description: "Temperature category derived from main_temp (°F): freezing / cold / mild / warm / hot."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['freezing', 'cold', 'mild', 'warm', 'hot']

      - name: wind_category
        description: "Wind category derived from wind_speed (mph): calm / light / moderate / strong / storm."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['calm', 'light', 'moderate', 'strong', 'storm']

      - name: precip_type
        description: "Precipitation type derived from rain_3h and snow_3h: none / rain / snow / rain_and_snow."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['none', 'rain', 'snow', 'rain_and_snow']
