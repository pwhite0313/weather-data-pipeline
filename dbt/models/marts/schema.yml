version: 2

models:
  - name: dim_city
    description: >
      Dimension table with one row per city. Contains static city metadata
      sourced from the OpenWeatherMap API. Deduplicates by keeping the most
      recent forecast record per city.

    columns:
      - name: city_id
        description: "Unique city identifier from the OpenWeatherMap API."
        tests:
          - not_null
          - unique

      - name: city_name
        description: "City name."
        tests:
          - not_null

      - name: city_country
        description: "ISO country code for the city."
        tests:
          - not_null

      - name: city_population
        description: "City population."

      - name: city_timezone
        description: "UTC offset in seconds."

      - name: city_coord_lat
        description: "City latitude."

      - name: city_coord_lon
        description: "City longitude."

  - name: fct_weather_daily
    description: >
      Daily weather summary aggregated from 3-hour forecast intervals.
      One row per city per forecast date. Built from fct_weather_forecast.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_id
              - forecast_date

    columns:
      - name: forecast_date
        description: "Forecast date derived from the 3-hour interval timestamp."
        tests:
          - not_null

      - name: city_id
        description: "Unique city identifier."
        tests:
          - not_null

      - name: city_name
        description: "City name."
        tests:
          - not_null

      - name: city_country
        description: "ISO country code."
        tests:
          - not_null

      - name: temp_min
        description: "Minimum forecasted temperature across all 3-hour periods for the day."

      - name: temp_max
        description: "Maximum forecasted temperature across all 3-hour periods for the day."

      - name: temp_avg
        description: "Average forecasted temperature for the day."

      - name: feels_like_avg
        description: "Average feels-like temperature for the day."

      - name: humidity_avg
        description: "Average humidity percentage for the day."

      - name: wind_speed_avg
        description: "Average wind speed for the day."

      - name: clouds_avg
        description: "Average cloud coverage percentage for the day."

      - name: total_rain
        description: "Total rain volume across all 3-hour periods for the day."

      - name: total_snow
        description: "Total snow volume across all 3-hour periods for the day."

      - name: forecast_periods
        description: "Number of 3-hour forecast intervals that make up the daily aggregate."

  - name: fct_weather_forecast
    description: >
      Fact table for weather forecast data. Contains key analytical columns
      for downstream consumption. Built incrementally from the staging model.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_id
              - local_dt

    columns:
      - name: local_dt
        description: "Forecast timestamp as provided by the API."
        tests:
          - not_null

      - name: city_id
        description: "Unique city identifier from the weather API."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_id

      - name: city_name
        description: "City name."
        tests:
          - not_null

      - name: city_country
        description: "Country code for the city."
        tests:
          - not_null

      - name: main_temp
        description: "Forecasted temperature."
        tests:
          - not_null

      - name: main_temp_min
        description: "Minimum forecasted temperature."

      - name: main_temp_max
        description: "Maximum forecasted temperature."

      - name: main_feels_like
        description: "Forecasted feels-like temperature."

      - name: main_humidity
        description: "Humidity percentage."
        tests:
          - not_null

      - name: clouds_all
        description: "Cloud coverage percentage."

      - name: rain_3h
        description: "Rain volume over the previous 3 hours."

      - name: snow_3h
        description: "Snow volume over the previous 3 hours. Null when no snow is forecasted."

      - name: wind_speed
        description: "Wind speed."
        tests:
          - not_null
          - is_non_negative:
              config:
                severity: warn
                store_failures: true

      - name: wind_gust
        description: "Wind gust speed."

      - name: weather_main
        description: "High-level weather condition."
        tests:
          - not_null

      - name: weather_description
        description: "Detailed weather condition description."

      - name: weather_id
        description: "Weather condition ID from the API."
        tests:
          - not_null

      - name: ingested_at
        description: >
          UTC timestamp of the raw load this row came from. Doubles as the
          incremental watermark: each run reads staging from the newest
          ingested_at already present here.
        tests:
          - not_null
