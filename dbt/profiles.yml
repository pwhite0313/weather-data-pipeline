weather_pipeline:
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      schema: analytics
      threads: 4

    prod:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST_PROD', env_var('WAREHOUSE_HOST')) }}"
      port: "{{ env_var('WAREHOUSE_PORT_PROD', env_var('WAREHOUSE_PORT', '5432')) | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB_PROD', env_var('WAREHOUSE_DB')) }}"
      user: "{{ env_var('WAREHOUSE_USER_PROD', env_var('WAREHOUSE_USER')) }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD_PROD', env_var('WAREHOUSE_PASSWORD')) }}"
      schema: analytics
      threads: 8

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: STAGING
      threads: 4

  target: "{{ env_var('DBT_TARGET', 'dev') }}"
