name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          WAREHOUSE_USER: test_user
          WAREHOUSE_PASSWORD: test_pass
          WAREHOUSE_HOST: localhost
          WAREHOUSE_DB: test_db

  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
      DBT_TARGET: snowflake
      # Placeholders. dbt parse renders the profile but never connects.
      SNOWFLAKE_ACCOUNT: ci
      SNOWFLAKE_USER: ci
      SNOWFLAKE_ROLE: ci
      SNOWFLAKE_WAREHOUSE: ci
      SNOWFLAKE_DATABASE: ci
      SNOWFLAKE_PRIVATE_KEY_PATH: /nonexistent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        run: dbt parse

      - name: The test count matches the README
        run: test "$(dbt ls --resource-type test -q | wc -l)" -eq 53

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd /tmp
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt
          grep linux_x64 gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c
          tar xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/

      - name: Scan full git history
        run: gitleaks git --redact -v .

